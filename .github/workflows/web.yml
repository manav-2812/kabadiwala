name: Web CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'

jobs:
  build-and-test:
    name: Node 20 — TypeScript, Tests, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript type check (§3.2)
        working-directory: web
        run: npx tsc --noEmit

      - name: npm audit (§3.1 — fail on high/critical)
        working-directory: web
        run: npm audit --audit-level=high
        continue-on-error: true  # non-blocking until baseline is clean

      - name: i18n key parity check
        working-directory: web
        run: npm run test:i18n

      - name: Unit tests — Vitest (§3.2)
        working-directory: web
        run: npm run test

      - name: Production build
        working-directory: web
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build

      - name: Bundle size check (§3.4)
        working-directory: web
        run: npm run measure:bundle

