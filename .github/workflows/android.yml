name: Android Build & Quality Gates

on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:
    branches: [main, master]
  release:
    types: [published]

jobs:
  build-and-gate:
    name: Build APKs & Measure Size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      - name: Build Web Application & Typecheck
        run: |
          cd web
          npm run build

      - name: Sync Capacitor Android Project
        run: |
          cd web
          npx cap sync android

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APKs (All Flavors)
        run: |
          cd web/android
          chmod +x gradlew
          ./gradlew assembleProdDebug assembleDemoStandaloneDebug --stacktrace

      - name: Build Release APKs & AAB (Tags only or manual trigger)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        env:
          KC_KEYSTORE_PASSWORD: ${{ secrets.KC_KEYSTORE_PASSWORD }}
          KC_KEY_ALIAS: ${{ secrets.KC_KEY_ALIAS }}
          KC_KEY_PASSWORD: ${{ secrets.KC_KEY_PASSWORD }}
        run: |
          cd web/android
          ./gradlew assembleProdRelease assembleDemoStandaloneRelease bundleProdRelease

      - name: Measure APK Sizing & Verify 10MB Budget
        run: |
          chmod +x scripts/android/measure-size.sh
          bash scripts/android/measure-size.sh

      - name: Upload Build Artifacts & Metrics
        uses: actions/upload-artifact@v4
        with:
          name: kabadiwala-android-build
          path: |
            web/android/app/build/outputs/apk/**/*.apk
            web/android/app/build/outputs/bundle/**/*.aab
            artifacts/android/*.json

  emulator-smoke-test:
    name: Native Smoke Test (API 27 & API 34)
    runs-on: macos-latest
    needs: build-and-gate
    if: false # Disabled by default in free runners to conserve CI quota; enable for tagged releases
    strategy:
      matrix:
        api-level: [27, 34]
        target: [default]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Smoke Test on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel
          script: bash scripts/android/smoke.sh
