<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg_COPPER_WIRE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg_COPPER_WIRE)" rx="12"/>
  <rect width="400" height="300" fill="url(#grid)" rx="12"/>

  <!-- Border accent -->
  <rect x="2" y="2" width="396" height="296" fill="none" stroke="#b45309" stroke-width="2" opacity="0.3" rx="10"/>

  <!-- Center Badge / Icon Container -->
  <rect x="140" y="70" width="120" height="90" rx="16" fill="#78350f" stroke="#b45309" stroke-width="2"/>
  <text x="200" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">CU</text>

  <!-- Material Label -->
  <text x="200" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#f4f4f5" text-anchor="middle">Clean Stripped Copper Wire</text>
  <text x="200" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#a1a1aa" text-anchor="middle">Material Code: COPPER_WIRE</text>

  <!-- Watermark / Demo Disclaimer -->
  <rect x="90" y="248" width="220" height="24" rx="6" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.1)"/>
  <text x="200" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#fbbf24" text-anchor="middle" letter-spacing="1">DEMO PLACEHOLDER PHOTO</text>
</svg>